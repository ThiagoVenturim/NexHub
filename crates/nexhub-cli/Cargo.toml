[package]
name = "nexhub-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nexhub"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
nexhub-core = { path = "../nexhub-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.17"
