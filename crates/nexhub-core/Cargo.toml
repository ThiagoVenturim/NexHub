[package]
name = "nexhub-core"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
cron = "0.15"
directories = "6.0"
portable-pty = "0.9"
regex = "1.11"
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
shell-words = "1.1"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "net", "time", "io-util"] }
tracing = "0.1"
ulid = "1.2"

[dev-dependencies]
tempfile = "3.17"
